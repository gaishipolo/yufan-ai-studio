[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "雨范 AI 短视频工作台 —— 后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "PyJWT>=2.9",
  "httpx>=0.27",
  "pillow>=11",
  "imageio-ffmpeg>=0.6",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "alembic>=1.14",
]

[project.scripts]
app = "cli:main"

# src/ 下是「多个顶层包 + 顶层模块」的扁平布局（core / db / api / infra / modules ...），
# 因此用 only-include + sources 把 src/ 前缀剥掉，而不是 packages = ["src/xxx"]。
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 种子数据是表格化字面量，拆行会严重降低可读性
"src/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
