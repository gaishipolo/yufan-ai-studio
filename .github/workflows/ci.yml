name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · pytest / ruff / mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      # 对象存储冒烟用。`minio/minio` 已从 Docker Hub 下架（pull 会 403），
      # 这里用重新打包官方二进制的 elestio 镜像，与本地开发保持一致。
      #
      # **不能用 `services:`**：这个镜像的 CMD 是 `["minio"]`，不补子命令时它打印
      # 一版 usage 就以退出码 0 结束——在 actions 眼里「服务已启动、健康检查通过」，
      # 而 9000 端口上什么都没有（首次上 CI 就是这么红的，本地 `docker run` 一跑
      # 就能看到 `Exited (0)`）。`services:` 不支持传 command，所以自己 run。
      - name: 启动 MinIO
        run: |
          docker run -d --name minio \
            -p 19000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            elestio/minio:latest server /data --console-address ":9001"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      # 替换模板的部分测试会真实执行 `settings.node_binary` 指向的 Node 运行时脚本
      # （编译链的 golden test 就在其中，缺 node 时它们 skip，等于白绿）。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # 容器就绪与否不在启动那一步判断：镜像自带的 health-cmd 依赖容器里有没有
      # curl/mc，换个镜像就会「秒过」。在 runner 上轮询，判据只取决于服务端真的在应答。
      - name: 等待 MinIO 就绪
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO 未在 60 秒内就绪，容器状态与日志：" >&2
          docker ps -a --filter name=minio >&2
          docker logs minio >&2 2>&1 || true
          exit 1

      # 接口契约四份生成物的一致性由 tests/test_openapi_contract.py 在 pytest 内校验。
      # 同时导出 S3_LIVE_*：tests/test_storage_s3_live.py 只有看到它才跑真实对象存储。
      - name: pytest
        env:
          S3_LIVE_ENDPOINT: http://127.0.0.1:19000
          S3_LIVE_ACCESS_KEY: minioadmin
          S3_LIVE_SECRET_KEY: minioadmin123
        run: pytest -q

      - name: ruff
        # scripts/ 只在部分开发分支存在，不存在时跳过，避免 main 上误报。
        run: |
          ruff check src tests
          if [ -d scripts ]; then ruff check scripts; fi

      # 迁移漂移的第二道闸（第一道是 tests/test_migrations.py）。
      # pytest 用 Base.metadata 建表，生产用 Alembic；这条用真实 CLI 在空库上
      # 走一遍「升级 + 比对」，顺带证明打包产物里有 migrations/ 与 alembic.ini。
      - name: 迁移与模型一致
        env:
          APP_ENV: dev
          SETTINGS_ENV_FILE: ./.ci-no-such.env
          DB_URL: sqlite+aiosqlite:///./var/ci-migrate.db
        run: |
          mkdir -p var
          alembic upgrade head
          alembic check

      - name: mypy
        # 项目依赖 Windows 共享盘与 Win32 API（ctypes.WinDLL）。CI 跑在 Linux，
        # 按 Linux typeshed 检查会把 WinDLL / get_last_error 判为不存在，故显式指定 win32。
        run: mypy --platform win32 src

  # 迁移的第三道闸：在真实 PostgreSQL 上跑一遍。
  #
  # 前两道（tests/test_migrations.py 与上面 backend 里的 sqlite 步骤）都只验证 sqlite
  # 方言。而「sqlite 绿、PG 炸」有几个经典位置：`server_default` 的表达式写法、
  # 部分索引谓词、`batch_alter_table` 重建表时的约束名解析、`sa.JSON` 与 `sa.Text`
  # 的差异。生产用的是 PG，这些差异只会在部署那一刻暴露。
  #
  # `continue-on-error` 是**观察期**设置，不是永久豁免：这条闸刚接入时没有历史基线，
  # 先用它暴露问题而不阻塞合并。观察稳定后去掉（TODO T30），之后它就是硬性要求。
  postgres-migrations:
    name: 迁移 · PostgreSQL（观察期）
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: 安装依赖（含 postgres 驱动）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: 空库升级到 head 并比对模型
        env:
          APP_ENV: dev
          SETTINGS_ENV_FILE: ./.ci-no-such.env
          DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/app_ci
        # 降级只回到「不可降级」的那道迁移 `b8e4c1f90d27`（下线替换链与旧封装表：
        # 11 张表的数据随之消失，它的 downgrade 故意 raise）。回到它 = 把其后的
        # 可逆迁移走一遍下行再升回来；再往下走没有意义，只会得到一句「降级成功但
        # 数据没了」的谎话。哪天又出现不可逆迁移，把这里的锚点换成那道。
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade b8e4c1f90d27
          alembic upgrade head

  frontend:
    name: 前端 · typecheck / lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 质量门禁
        run: npm run verify
